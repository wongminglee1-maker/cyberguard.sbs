<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 页面未找到 - CyberGuard</title>
  <meta name="description" content="您所请求的页面不存在或已被移除。请返回 CyberGuard 首页或查阅技术文章。">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-container {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 60px 24px;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      font-family: var(--font-mono);
      line-height: 1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #00D9D0 0%, #477BFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 217, 208, 0.2);
    }
    .error-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--color-cyan);
      padding: 6px 14px;
      border: 1px solid rgba(0, 217, 208, 0.3);
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <header class="site-header scrolled">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo" aria-label="CyberGuard 首页">
        <div class="brand-shield" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 2L5 7V16C5 24.5 10.5 31.8 18 34C25.5 31.8 31 24.5 31 16V7L18 2Z" stroke="#00D9D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 9V27M12 14L24 22M12 22L24 14" stroke="#477BFF" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="18" cy="18" r="3.5" fill="#00D9D0"/>
          </svg>
        </div>
        <div class="brand-name">
          <span>CyberGuard</span>
          <span class="brand-badge">SYSTEM 404</span>
        </div>
      </a>
      <div class="header-actions">
        <a href="index.html" class="btn btn-primary btn-sm">返回首页</a>
      </div>
    </div>
  </header>

  <main class="error-container">
    <div class="error-badge">ROUTING_TARGET_NOT_FOUND // 404 EXCEPTION</div>
    <div class="error-code">404</div>
    <h1 style="font-size: 1.8rem; margin-bottom: 16px;">您请求的资源节点未就绪或已被重定向</h1>
    <p style="max-width: 540px; margin: 0 auto 32px auto; color: var(--text-secondary);">
      抱歉，当前访问的 URL 路径不存在。可能页面已被迁移或您输入的网址有误。建议返回主控制面板或查阅我们的技术知识库。
    </p>

    <div style="display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;">
      <a href="index.html" class="btn btn-primary">
        <span>返回首页总览</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>
      <a href="index.html#articles" class="btn btn-secondary">
        <span>查阅技术知识库</span>
      </a>
      <a href="index.html#pricing" class="btn btn-secondary">
        <span>查看套餐方案</span>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom-bar">
        <div>
          <span>© 2026 CyberGuard (cyberguard.sbs) · 官方网络连接与服务门户</span>
        </div>
        <div>
          <a href="index.html" style="color: var(--text-muted); margin-right: 16px;">首页</a>
          <a href="privacy.html" style="color: var(--text-muted); margin-right: 16px;">隐私政策</a>
          <a href="terms.html" style="color: var(--text-muted);">服务条款</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
